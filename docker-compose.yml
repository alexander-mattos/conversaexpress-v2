# Produção: Caddy (HTTPS automático) -> frontend e backend; Postgres e Redis
# só na rede interna. Configure o .env (copie de .env.docker.example) e rode:
#   docker compose up -d --build
name: conversaexpress

x-backend-env: &backend-env
  NODE_ENV: production
  PORT: "8080"
  BACKEND_URL: https://${BACKEND_DOMAIN:?defina BACKEND_DOMAIN no .env}
  FRONTEND_URL: https://${FRONTEND_DOMAIN:?defina FRONTEND_DOMAIN no .env}
  FRONTEND_EXTRA_ORIGINS: ${FRONTEND_EXTRA_ORIGINS:-}
  # As URLs públicas já passam pelo Caddy (443): sem porta extra.
  PROXY_PORT: ""
  DB_DIALECT: postgres
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-conversaexpress}
  DB_USER: ${DB_USER:-conversaexpress}
  DB_PASS: ${DB_PASS:?defina DB_PASS no .env}
  DB_DEBUG: ${DB_DEBUG:-false}
  REDIS_URI: redis://:${REDIS_PASS:?defina REDIS_PASS no .env}@redis:6379
  REDIS_OPT_LIMITER_MAX: ${REDIS_OPT_LIMITER_MAX:-1}
  REDIS_OPT_LIMITER_DURATION: ${REDIS_OPT_LIMITER_DURATION:-3000}
  JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET no .env}
  ENV_TOKEN: ${ENV_TOKEN:-}
  SIGNUP_TRIAL_DAYS: ${SIGNUP_TRIAL_DAYS:-3}
  USER_LIMIT: ${USER_LIMIT:-10000}
  CONNECTIONS_LIMIT: ${CONNECTIONS_LIMIT:-100000}
  CLOSED_SEND_BY_ME: ${CLOSED_SEND_BY_ME:-true}
  ASAAS_API_KEY: ${ASAAS_API_KEY:-}
  ASAAS_SANDBOX: ${ASAAS_SANDBOX:-false}
  ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_USER: ${MAIL_USER:-}
  MAIL_PASS: ${MAIL_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-}
  MAIL_PORT: ${MAIL_PORT:-465}
  INTEGRATION_ALLOWED_HOSTS: ${INTEGRATION_ALLOWED_HOSTS:-}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-conversaexpress}
      POSTGRES_USER: ${DB_USER:-conversaexpress}
      POSTGRES_PASSWORD: ${DB_PASS:?defina DB_PASS no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASS:?defina REDIS_PASS no .env}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASS\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASS: ${REDIS_PASS}

  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mídias de mensagens, campanhas e arquivos.
      - backend_public:/app/public
      - backend_private:/app/private

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: https://${BACKEND_DOMAIN}
        NEXT_PUBLIC_HOURS_CLOSE_TICKETS_AUTO: ${HOURS_CLOSE_TICKETS_AUTO:-24}
    restart: unless-stopped
    init: true
    depends_on:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL no .env}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  redisdata:
  backend_public:
  backend_private:
  caddy_data:
  caddy_config:
