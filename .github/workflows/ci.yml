name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      # Informativo até o código ser formatado: hoje há milhares de erros de estilo.
      - name: Lint (informativo)
        run: npm run lint
        continue-on-error: true

  frontend:
    name: Frontend (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker (build das imagens + compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valida os arquivos compose
        run: |
          sed -e 's/^DB_PASS=$/DB_PASS=ci/' -e 's/^REDIS_PASS=$/REDIS_PASS=ci/' \
              -e 's/^JWT_SECRET=$/JWT_SECRET=ci/' -e 's/^JWT_REFRESH_SECRET=$/JWT_REFRESH_SECRET=ci/' \
              .env.docker.example > .env
          docker compose config -q
          docker compose -f docker-compose.dev.yml config -q
      - name: Build do backend
        run: docker build -t conversaexpress-backend:ci backend
      - name: Build do frontend
        run: docker build --build-arg NEXT_PUBLIC_BACKEND_URL=https://api.exemplo.com -t conversaexpress-frontend:ci frontend
